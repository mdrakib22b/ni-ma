name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: Lint (duplicate members / keys, dangling template bindings)
        run: npm run lint

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test (boot, PWA install criteria, offline, budget-section flow)
        run: npm run smoke
